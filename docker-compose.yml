# Local smoke test. Runs the app in production mode (same as the EC2 target)
# against a throwaway MySQL 8.0 container.
#
#   docker compose build
#   docker compose up -d db            # wait ~30s for MySQL to initialise
#   docker compose run --rm web bundle exec rails db:schema:load
#   docker compose up
#
# Use db:schema:load, NOT db:migrate: the migration history cannot replay from
# scratch (20220329230221_drop_tables drops a `genres` table that no migration
# creates). db/schema.rb is the authoritative, current schema.
#
# Then open http://localhost:3000
services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app_production
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: local_smoke_test_secret_key_base_not_for_real_use
      DB_HOST: db
      DB_DATABASE: app_production
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      - db
    volumes:
      # refile stores uploads on the local filesystem; keep them across restarts.
      - uploads:/app/tmp/uploads

volumes:
  db_data:
  uploads:
